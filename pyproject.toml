[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skuld"
version = "0.3.0"
description = "AI-powered test case generator with adversarial cross-model review and RTM-based deterministic scoring"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.0.0",
]
providers = [
    "skuld[anthropic]",
    "skuld[openai]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
skuld = "skuld.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["skuld"]
branch = true

[tool.coverage.report]
fail_under = 90
